[platformio]
default_envs = c3

[env]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; FoloToy AI Passport: identical firmware plus a small text page on the built-in
; 240x320 panel (join this hotspot / open this page). No other behaviour changes.
[env:aipassport]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DADBLOCK_AIPASSPORT=1
